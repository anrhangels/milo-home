name: Ошибка Milo Home
description: Проблема лаунчера, пульта или обновлений
title: "[Bug] "
body:
  - type: dropdown
    id: edition
    attributes:
      label: Вариант
      options: [Standard, ByeByeDPI]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Milo Home
      placeholder: "0.0.8, versionCode 109"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Модель ТВ, Android и ABI
      description: Не указывайте IP, серийный номер, аккаунт или SSID.
  - type: textarea
    id: steps
    attributes:
      label: Что произошло и как повторить
      description: Ожидаемый результат, фактический результат, способ установки.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Проверки и снимки
      description: Только очищенные от приватных данных сведения. Не прикладывайте ключи или токены.
