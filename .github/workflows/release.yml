name: Publish Milo Home
on:
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options: [standard, byedpi]
        required: true
      channel:
        type: choice
        options: [stable, rc]
        required: true
      track:
        type: choice
        options: [test, production]
        default: test
        required: true
      version_code:
        description: Monotonic Android versionCode for this track
        required: true
      version_name:
        description: Semver (e.g. 1.0.0 or 1.1.0-rc.1)
        required: true
permissions:
  contents: read
concurrency:
  group: milo-release-${{ inputs.variant }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ${{ inputs.track == 'test' && 'test-releases' || 'production-releases' }}
    permissions:
      contents: write
    env:
      VARIANT: ${{ inputs.variant }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      CHANNEL: ${{ inputs.channel }}
      TRACK: ${{ inputs.track }}
      UPDATE_REPO: ${{ github.repository }}
      EXPECTED_SIGNER: ${{ vars.MILO_SIGNER_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate release before loading any signing secret
        run: |
          python tools/milo/verify_public_tree.py
          python -m unittest discover -s tools/milo -p 'test_*.py' -v
          gh api "repos/$UPDATE_REPO/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/prior.json"
          python tools/milo/release.py --code "$VERSION_CODE" --name "$VERSION_NAME" --channel "$CHANNEL" --track "$TRACK" --variant "$VARIANT" --prior "$RUNNER_TEMP/prior.json"
          test "${#EXPECTED_SIGNER}" -eq 64
      - name: Install pinned Android build dependencies
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0"'
      - name: Restore signing key to temporary runner storage
        env:
          KEY_B64: ${{ secrets.MILO_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/milo-signing.p12"
          test -s "$RUNNER_TEMP/milo-signing.p12"
      - name: Test, lint and sign (same environment key for Stable and RC)
        working-directory: launcher
        env:
          MILO_KEYSTORE: ${{ runner.temp }}/milo-signing.p12
          MILO_STORE_PASSWORD: ${{ secrets.MILO_STORE_PASSWORD }}
          MILO_KEY_ALIAS: ${{ secrets.MILO_KEY_ALIAS }}
          MILO_KEY_PASSWORD: ${{ secrets.MILO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease "-PmiloVersionCode=$VERSION_CODE" "-PmiloVersionName=$VERSION_NAME" "-PmiloUpdateRepo=$UPDATE_REPO" "-PmiloUpdateTrack=$TRACK" "-PmiloVariant=$VARIANT"
      - name: Cryptographic verification, metadata and monotonic version recheck
        run: |
          mkdir -p release-output
          cp launcher/app/build/outputs/apk/release/app-release.apk "release-output/MiloHome-$VARIANT.apk"
          gh api "repos/$UPDATE_REPO/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/prior.json"
          python tools/milo/release.py --code "$VERSION_CODE" --name "$VERSION_NAME" --channel "$CHANNEL" --track "$TRACK" --variant "$VARIANT" --prior "$RUNNER_TEMP/prior.json" --apk "release-output/MiloHome-$VARIANT.apk" --tools "$ANDROID_HOME/build-tools/35.0.0" --signer "$EXPECTED_SIGNER" --notes docs/releases/next.md --out release-output > "$RUNNER_TEMP/release-tag.txt"
      - name: Publish only explicitly dispatched release
        run: |
          TAG="$(cat "$RUNNER_TEMP/release-tag.txt")"
          flags=(--latest=false)
          if [ "$CHANNEL" = rc ]; then flags+=(--prerelease); fi
          if [ "$CHANNEL" = stable ] && [ "$TRACK" = production ] && [ "$VARIANT" = standard ]; then flags=(--latest); fi
          gh release create "$TAG" "release-output/MiloHome-$VARIANT.apk" "release-output/MiloHome-$VARIANT.apk".sha256 release-output/update.json --repo "$UPDATE_REPO" --target "$GITHUB_SHA" --title "Milo Home $VERSION_NAME ($VARIANT / $TRACK / $CHANNEL)" --notes-file release-output/release-notes.md "${flags[@]}"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/milo-signing.p12"
