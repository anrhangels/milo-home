name: Publish Milo Home
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Internal code; must exceed every previous build
        default: "117"
        required: true
      version_name:
        description: Public version
        default: "0.1.2"
        required: true
permissions:
  contents: read
concurrency:
  group: milo-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production-releases
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      UPDATE_REPO: ${{ github.repository }}
      EXPECTED_SIGNER: ${{ vars.MILO_SIGNER_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate release before loading any signing secret
        run: |
          python tools/milo/verify_public_tree.py
          python -m unittest discover -s tools/milo -p 'test_*.py' -v
          gh api "repos/$UPDATE_REPO/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/prior.json"
          python tools/milo/bundle_release.py --code "$VERSION_CODE" --name "$VERSION_NAME" --prior "$RUNNER_TEMP/prior.json"
          test "${#EXPECTED_SIGNER}" -eq 64
      - name: Install pinned Android build dependencies
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"'
      - name: Build corresponding GPL backend from included source
        run: python tools/milo/build_backend.py --out "$RUNNER_TEMP/backend-source"
      - name: Restore signing key to temporary runner storage
        env:
          KEY_B64: ${{ secrets.MILO_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/milo-signing.p12"
          test -s "$RUNNER_TEMP/milo-signing.p12"
      - name: Test, lint and sign (same environment key for Stable and RC)
        working-directory: launcher
        env:
          MILO_KEYSTORE: ${{ runner.temp }}/milo-signing.p12
          MILO_STORE_PASSWORD: ${{ secrets.MILO_STORE_PASSWORD }}
          MILO_KEY_ALIAS: ${{ secrets.MILO_KEY_ALIAS }}
          MILO_KEY_PASSWORD: ${{ secrets.MILO_KEY_PASSWORD }}
        run: |
          python ../tools/milo/sign_backend.py --input "$RUNNER_TEMP/backend-source/ByeByeDPI/app/build/outputs/apk/release/app-universal-release-unsigned.apk" --output "$RUNNER_TEMP/backend.apk"
          export MILO_BACKEND_APK="$RUNNER_TEMP/backend.apk"
          chmod +x gradlew
          mkdir -p ../release-output
          for VARIANT in standard byedpi; do
            ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease "-PmiloVersionCode=$VERSION_CODE" "-PmiloVersionName=$VERSION_NAME" "-PmiloUpdateRepo=$UPDATE_REPO" -PmiloUpdateTrack=production "-PmiloVariant=$VARIANT"
            ASSET=Milo-Home.apk
            if [ "$VARIANT" = byedpi ]; then ASSET=Milo-Home-ByeByeDPI.apk; fi
            cp app/build/outputs/apk/release/app-release.apk "../release-output/$ASSET"
          done
      - name: Cryptographic verification, metadata and monotonic version recheck
        run: |
          mkdir -p release-output
          gh api "repos/$UPDATE_REPO/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/prior.json"
          python tools/milo/bundle_release.py --code "$VERSION_CODE" --name "$VERSION_NAME" --prior "$RUNNER_TEMP/prior.json" --tools "$ANDROID_HOME/build-tools/35.0.0" --signer "$EXPECTED_SIGNER" --notes docs/releases/next.md --out release-output > "$RUNNER_TEMP/release-tag.txt"
      - name: Publish one version with both editions
        run: |
          TAG="$(cat "$RUNNER_TEMP/release-tag.txt")"
          FLAGS=(--latest)
          if [[ "$VERSION_NAME" == *-rc.* ]]; then FLAGS=(--prerelease --latest=false); fi
          gh release create "$TAG" release-output/*.apk --repo "$UPDATE_REPO" --target "$GITHUB_SHA" --title "Milo Home $VERSION_NAME" --notes-file release-output/release-notes.md "${FLAGS[@]}"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/milo-signing.p12"
