plugins {
    id 'com.android.application'
}

def miloVersion = new Properties()
rootProject.file('../version.properties').withInputStream { miloVersion.load(it) }
def instrumentedMilo = providers.gradleProperty('miloInstrumented').isPresent()
def miloVariant = providers.gradleProperty('miloVariant').getOrElse('standard')
if (!(miloVariant in ['standard', 'byedpi'])) throw new GradleException('Unknown Milo variant')
if(instrumentedMilo && providers.gradleProperty('miloUpdateTrack').getOrElse('production') != 'test') {
    throw new GradleException('Instrumented builds are restricted to the isolated test track')
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    buildFeatures { buildConfig true }
    testBuildType 'release'
    if(System.getenv('MILO_TEST_ASSETS')) sourceSets.androidTest.assets.srcDir(System.getenv('MILO_TEST_ASSETS'))
    if(miloVariant == 'standard') sourceSets.release.manifest.srcFile 'src/standard/AndroidManifest.xml'
    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        targetSdk 34
        versionCode providers.gradleProperty('miloVersionCode').getOrElse(miloVersion['versionCode']).toInteger()
        versionName providers.gradleProperty('miloVersionName').getOrElse(miloVersion['versionName'])
        buildConfigField 'String', 'UPDATE_REPO', '"' + providers.gradleProperty('miloUpdateRepo').getOrElse('anrhangels/milo-home') + '"'
        buildConfigField 'String', 'UPDATE_TRACK', '"' + providers.gradleProperty('miloUpdateTrack').getOrElse('production') + '"'
        buildConfigField 'String', 'UPDATE_VARIANT', '"' + miloVariant + '"'
        buildConfigField 'boolean', 'BYEDPI_ENABLED', (miloVariant == 'byedpi').toString()
        manifestPlaceholders = [miloVariant: miloVariant, miloAppLabel: miloVariant == 'byedpi' ? 'Milo Home + ByeByeDPI' : 'Milo Home']
    }

    signingConfigs {
        permanent {
            if(System.getenv('MILO_KEYSTORE')) {
                storeFile file(System.getenv('MILO_KEYSTORE'))
                storePassword System.getenv('MILO_STORE_PASSWORD')
                keyAlias System.getenv('MILO_KEY_ALIAS')
                keyPassword System.getenv('MILO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled !instrumentedMilo
            shrinkResources !instrumentedMilo
            debuggable instrumentedMilo
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Isolated test builds use this machine's debug key, not the installed TV key. The release workflow
            // requires an explicit environment keystore and verifies its public fingerprint.
            signingConfig System.getenv('MILO_KEYSTORE') ? signingConfigs.permanent : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    implementation 'com.android.tools.build:apksig:8.5.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
